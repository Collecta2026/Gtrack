<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Gtrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-left">
      <div class="eyebrow">Scientific Gate Egypt</div>
      <h1>Gtrack</h1>
      <div class="tag" style="margin-bottom:.9rem">Import &amp; Equipment Tracking</div>
      <div class="tag">Internal system — purchase order through to installation handover.</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <div class="field" style="margin-bottom:.7rem">
          <label for="email">{{ t("Email") }}</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="field" style="margin-bottom:1rem">
          <label for="password">{{ t("Password") }}</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button class="btn" type="submit" style="width:100%">{{ t("Sign in") }}</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
