{% extends "base.html" %}
{% block heading %}{{ code }}{% endblock %}
{% block crumb %}{{ t("Something isn't available") }}{% endblock %}

{% block content %}
<div class="card">
  <div class="empty">
    <div style="font-size:2.4rem;font-weight:700;color:var(--navy);margin-bottom:.4rem">{{ code }}</div>
    <div>{{ message }}</div>
    <div style="margin-top:1rem">
      <a class="btn ghost sm" href="{{ url_for('dashboard.index') }}">{{ t("Back to dashboard") }}</a>
    </div>
  </div>
</div>
{% endblock %}
