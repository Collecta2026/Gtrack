{% extends "base.html" %}
{% block heading %}{{ t("Set your password") }}{% endblock %}
{% block crumb %}{{ t("You're signed in with a temporary password — choose your own to continue.") }}{% endblock %}

{% block content %}

<div class="card" style="max-width:420px">
  <div class="card-body">
    <form method="post">
      <div class="field" style="margin-bottom:.7rem">
        <label>{{ t("Current (temporary) password") }}</label>
        <input type="password" name="current_password" required autofocus>
      </div>
      <div class="field" style="margin-bottom:.7rem">
        <label>{{ t("New password") }}</label>
        <input type="password" name="new_password" required minlength="6">
      </div>
      <div class="field" style="margin-bottom:1rem">
        <label>{{ t("Confirm new password") }}</label>
        <input type="password" name="confirm_password" required minlength="6">
      </div>
      <button class="btn" type="submit" style="width:100%">{{ t("Set password") }}</button>
    </form>
  </div>
</div>

{% endblock %}
